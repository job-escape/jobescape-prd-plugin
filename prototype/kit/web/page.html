  <div class="min-h-(--je-frame-h) bg-background pb-24 desktop:pb-10">

    <!-- Settings sidebar (desktop). The current section is the item with. -->
    <aside aria-label="Settings navigation" class="fixed inset-y-0 start-0 z-20 hidden w-60 flex-col border-e border-border bg-background desktop:flex">
      <div class="px-3 pt-4 pb-2">
        <a href="#" class="flex h-9 items-center gap-3 rounded-2xl px-2 text-sm text-foreground transition-colors hover:bg-surface-tertiary">
          <i data-icon="arrow-uturn-ccw-left" class="size-5"></i>Back to app
        </a>
      </div>
      <nav class="flex flex-col gap-1.5 px-3">
        <a href="#" data-nav-item="account" data-press="tab:account" class="group flex h-9 items-center gap-3 rounded-2xl px-2 text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary aria-[current=page]:bg-surface-tertiary aria-[current=page]:font-medium">
          <i data-icon="person" class="size-5 text-muted group-aria-[current=page]:text-foreground"></i>Account
        </a>
        <a href="#" data-nav-item="preferences" data-press="tab:preferences" class="group flex h-9 items-center gap-3 rounded-2xl px-2 text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary aria-[current=page]:bg-surface-tertiary aria-[current=page]:font-medium">
          <i data-icon="sliders" class="size-5 text-muted group-aria-[current=page]:text-foreground"></i>Preferences
        </a>
        <a href="#" data-nav-item="plan-management" data-press="tab:plan-management" class="group flex h-9 items-center gap-3 rounded-2xl px-2 text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary aria-[current=page]:bg-surface-tertiary aria-[current=page]:font-medium">
          <i data-icon="seal-check" class="size-5 text-muted group-aria-[current=page]:text-foreground"></i>Plan management
        </a>
        <a href="#" data-nav-item="portfolio" data-press="tab:portfolio" class="group flex h-9 items-center gap-3 rounded-2xl px-2 text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary aria-[current=page]:bg-surface-tertiary aria-[current=page]:font-medium">
          <i data-icon="briefcase" class="size-5 text-muted group-aria-[current=page]:text-foreground"></i>Portfolio
        </a>
        <button type="button" class="flex h-9 items-center gap-3 rounded-2xl px-2 text-start text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary">
          <i data-icon="circle-question" class="size-5 text-muted"></i>Support center
        </button>
        <a href="#" data-nav-item="legal-privacy" data-press="tab:legal-privacy" class="group flex h-9 items-center gap-3 rounded-2xl px-2 text-sm font-normal text-foreground transition-colors hover:bg-surface-tertiary aria-[current=page]:bg-surface-tertiary aria-[current=page]:font-medium">
          <i data-icon="shield-keyhole" class="size-5 text-muted group-aria-[current=page]:text-foreground"></i>Legal &amp; Privacy
        </a>
      </nav>
    </aside>

    <!-- Header: back + section title on mobile, breadcrumbs on desktop. -->
    <header class="flex h-16 items-center px-4 desktop:ms-60 desktop:h-15 desktop:border-b desktop:border-border desktop:px-5">
      <button type="button" class="flex h-6 min-w-0 items-center gap-3 text-foreground desktop:hidden">
        <i data-icon="chevron-left" class="size-5 shrink-0 text-muted"></i>
        <span data-title-slot class="truncate text-base font-normal">Account</span>
      </button>
      <div class="hidden items-center gap-2 text-sm desktop:flex">
        <ol aria-label="Breadcrumb" data-hero="Breadcrumbs" class="min-w-0">
          <li data-slot="item" class="font-medium"><a href="#" data-slot="link">Settings</a><i data-icon="chevron-right" data-slot="separator"></i></li>
          <li data-slot="item" class="font-medium"><span data-slot="link" data-current="true" data-title-slot>Account</span></li>
        </ol>
      </div>
    </header>

    <div class="px-4 pb-6 desktop:ms-60 desktop:px-6 desktop:pt-5 desktop:pb-6">
      <main data-outlet class="mx-auto w-full max-w-160 min-w-0"></main>
    </div>
  </div>
</template>

<template data-layout="registration">
  <div class="flex min-h-(--je-frame-h) flex-col items-stretch bg-background text-foreground">

    <!-- Stepper. Each step has data-status="complete" | "active" | "inactive"; the line after
         an active or complete step is filled. -->
    <div class="w-full">
      <div class="mx-auto h-[110px] w-full max-w-125 px-3 pt-4 pb-8 desktop:h-[102px] desktop:py-5">
        <ol data-stepper aria-label="Registration steps" class="flex items-start">
          <li data-status="active" class="group relative flex flex-1 flex-col items-center">
            <div class="relative z-10 flex flex-col items-center gap-1.5">
              <span class="flex size-9 shrink-0 items-center justify-center rounded-full border-2 border-border text-sm font-semibold text-muted group-data-[status=active]:border-accent group-data-[status=active]:text-accent group-data-[status=complete]:border-accent group-data-[status=complete]:bg-accent group-data-[status=complete]:text-accent-foreground">
                <span class="group-data-[status=complete]:hidden">1</span><i data-icon="check" class="hidden size-4 group-data-[status=complete]:inline-flex"></i>
              </span>
              <span class="text-center text-sm leading-5 font-medium text-muted group-data-[status=active]:text-foreground group-data-[status=complete]:text-foreground">Create account</span>
            </div>
            <span class="absolute top-4.25 right-[calc(-50%+18px)] left-[calc(50%+18px)] h-0.5 overflow-hidden bg-separator"><span class="absolute inset-0 origin-left scale-x-0 bg-accent transition-transform group-data-[status=active]:scale-x-100 group-data-[status=complete]:scale-x-100"></span></span>
          </li>
          <li data-status="inactive" class="group relative flex flex-1 flex-col items-center">
            <div class="relative z-10 flex flex-col items-center gap-1.5">
              <span class="flex size-9 shrink-0 items-center justify-center rounded-full border-2 border-border text-sm font-semibold text-muted group-data-[status=active]:border-accent group-data-[status=active]:text-accent group-data-[status=complete]:border-accent group-data-[status=complete]:bg-accent group-data-[status=complete]:text-accent-foreground">
                <span class="group-data-[status=complete]:hidden">2</span><i data-icon="check" class="hidden size-4 group-data-[status=complete]:inline-flex"></i>
              </span>
              <span class="text-center text-sm leading-5 font-medium text-muted group-data-[status=active]:text-foreground group-data-[status=complete]:text-foreground">Add offer</span>
            </div>
            <span class="absolute top-4.25 right-[calc(-50%+18px)] left-[calc(50%+18px)] h-0.5 overflow-hidden bg-separator"><span class="absolute inset-0 origin-left scale-x-0 bg-accent transition-transform group-data-[status=active]:scale-x-100 group-data-[status=complete]:scale-x-100"></span></span>
          </li>
          <li data-status="inactive" class="group relative flex flex-1 flex-col items-center">
            <div class="relative z-10 flex flex-col items-center gap-1.5">
              <span class="flex size-9 shrink-0 items-center justify-center rounded-full border-2 border-border text-sm font-semibold text-muted group-data-[status=active]:border-accent group-data-[status=active]:text-accent group-data-[status=complete]:border-accent group-data-[status=complete]:bg-accent group-data-[status=complete]:text-accent-foreground">
                <span class="group-data-[status=complete]:hidden">3</span><i data-icon="check" class="hidden size-4 group-data-[status=complete]:inline-flex"></i>
              </span>
              <span class="text-center text-sm leading-5 font-medium text-muted group-data-[status=active]:text-foreground group-data-[status=complete]:text-foreground">Get app</span>
            </div>
          </li>
        </ol>
      </div>
    </div>

    <main data-outlet class="mt-4 w-full px-4 desktop:mt-28"></main>
  </div>
</template>

<!-- ═══ SCREENS ═══════════════════════════════════════════════════════════════
     One <section data-screen> per Screen; its content is the page inside the
     Layout. data-states lists the Screen's States; data-when / data-unless on
     any element show or hide it per State. -->
<section data-screen="example" data-layout="app" data-nav="personal-plan" data-title="Personal Plan" data-states="default loading">
  <div class="mx-auto flex w-full max-w-160 flex-col gap-4">
    <div data-hero="Card" data-unless="loading">
      <div data-slot="header">
        <h2 data-slot="title">Card title</h2>
        <p data-slot="description">Body copy, muted.</p>
      </div>
      <div data-slot="footer">
        <button data-hero="Button" data-variant="primary" data-press="action:submit">
          <span data-slot="label">Continue</span>
        </button>
      </div>
    </div>
    <div data-hero="Skeleton" class="h-36 rounded-3xl" data-when="loading"></div>
  </div>
</section>

</body>
</html>
